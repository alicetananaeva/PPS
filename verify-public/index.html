<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Survey completion verification</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Dr. Udell's class</p>
      <h1 id="page-title">Survey completion verification</h1>
      <p class="intro">Enter the confirmation code submitted by a student. This page verifies completion only and does not provide access to questionnaire answers or results.</p>

      <form id="verification-form" novalidate>
        <label for="completion-code">Completion code</label>
        <div class="form-row">
          <input id="completion-code" name="completion-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="PPS-ABCD-2345" maxlength="14" required>
          <button type="submit">Verify</button>
        </div>
      </form>

      <div id="verification-result" class="result hidden" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
